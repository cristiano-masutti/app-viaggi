name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      # Il contratto dell'API: se cambia, i tipi del mobile vanno rigenerati.
      - 'apps/backend/openapi.json'
      - '.github/workflows/mobile.yml'
      - '.nvmrc'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/backend/openapi.json'
      - '.github/workflows/mobile.yml'
      - '.nvmrc'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, API types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      # Se il backend ha cambiato il contratto senza che il mobile rigenerasse
      # i tipi, qui il diff non è vuoto: `npm run api:types` e commit.
      - name: API types match apps/backend/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run typecheck

      - run: npm test -- --ci
